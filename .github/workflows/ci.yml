name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Web package check
        working-directory: packages/web
        run: npm run check
      - uses: osolmaz/slophammer@main
        with:
          checker: ts
          version: 0.4.0
