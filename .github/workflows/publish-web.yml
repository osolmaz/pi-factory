name: Publish web

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    # Web releases use the tag web-v<version>; publish.yml handles the root package and
    # skips those tags. A manual run publishes whatever version the package manifest holds.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'web-v')
    # npm trusted publishing + provenance requires a GitHub-hosted runner.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          check-latest: true
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Validate package metadata for trusted publishing
        run: |
          node - <<'NODE'
          const { readFileSync } = require("node:fs");

          const pkg = JSON.parse(readFileSync("packages/web/package.json", "utf8"));
          const expectedName = "@osolmaz/pi-factory-web";
          const expectedRepoUrl = "https://github.com/osolmaz/pi-factory";

          const normalizeRepoUrl = (value) =>
            String(value ?? "")
              .trim()
              .replace(/^git\+/, "")
              .replace(/\.git$/i, "")
              .replace(/\/+$/, "");

          const actualRepoUrl = normalizeRepoUrl(pkg?.repository?.url);
          const errors = [];

          if (pkg?.name !== expectedName) {
            errors.push(`package.json name must be ${expectedName}; found ${pkg?.name ?? "<missing>"}`);
          }
          if (pkg?.private === true) {
            errors.push("package.json must not be private for npm publishing.");
          }
          if (actualRepoUrl !== expectedRepoUrl) {
            errors.push(
              `package.json repository.url must resolve to ${expectedRepoUrl}; found ${actualRepoUrl || "<missing>"}`
            );
          }
          if (pkg?.repository?.directory !== "packages/web") {
            errors.push(
              `package.json repository.directory must be packages/web; found ${pkg?.repository?.directory ?? "<missing>"}`
            );
          }
          if (pkg?.publishConfig?.access !== "public") {
            errors.push("package.json publishConfig.access must be public.");
          }
          for (const entry of ["dist/src/**", "dist/ui/**", "README.md", "LICENSE"]) {
            if (!Array.isArray(pkg?.files) || !pkg.files.includes(entry)) {
              errors.push(`package.json files must include ${entry}.`);
            }
          }

          if (errors.length > 0) {
            for (const err of errors) {
              console.error(err);
            }
            process.exit(1);
          }

          console.log(`Package metadata validated for ${expectedName}@${pkg.version}.`);
          NODE
      - name: Verify release tag
        if: github.event_name == 'release'
        run: |
          version="$(node -p "require('./packages/web/package.json').version")"
          tag="${GITHUB_REF_NAME}"
          if [ "$tag" != "web-v$version" ] && [ "$tag" != "web-$version" ]; then
            echo "Release tag $tag does not match the web package version $version." >&2
            exit 1
          fi
      - name: Require the release commit on the default branch
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "The tagged commit is not on main; release from the default branch." >&2
            exit 1
          fi
      - name: Check whether the version needs publishing
        id: release
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./packages/web/package.json').version")"
          published_version="$(npm view "@osolmaz/pi-factory-web@$package_version" version 2>/dev/null || true)"

          if [ "$published_version" = "$package_version" ]; then
            echo "@osolmaz/pi-factory-web@$package_version is already published; skipping upload."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing @osolmaz/pi-factory-web@$package_version"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      # The package's prepublishOnly script runs `npm run check` before the upload, so a
      # failing check stops the publish here.
      - if: steps.release.outputs.publish == 'true'
        working-directory: packages/web
        run: npm publish --access public --provenance
