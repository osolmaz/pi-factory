name: mutation

# Mutation testing is slow, so it stays out of the default gate. It runs weekly and on request.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run mutate
