<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-label="pi-factory: a manifest goes in, an isolated standalone Pi app comes out">
  <defs>
    <style>
      .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="958" height="318" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <!-- Left: name, tagline, command line (content spans y 76-244, centered on 160) -->
  <g>
    <text x="56" y="110" class="mono" font-size="46" font-weight="700">
      <tspan fill="#58a6ff">pi</tspan><tspan fill="#e6edf3">-factory</tspan>
    </text>
    <text x="56" y="148" class="sans" font-size="17" fill="#8b949e">Develop and deploy isolated Pi app bundles.</text>
    <text x="56" y="174" class="sans" font-size="17" fill="#8b949e">Own config, prompts, extensions, and state per app.</text>

    <rect x="56" y="200" width="276" height="44" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="74" y="228" class="mono" font-size="16">
      <tspan fill="#3fb950">$</tspan><tspan fill="#e6edf3" dx="8">pi-factory init my-app</tspan>
    </text>
  </g>

  <!-- Middle: manifest card -->
  <g transform="translate(528,58)">
    <rect width="160" height="204" rx="10" fill="#161b22" stroke="#30363d"/>
    <circle cx="18" cy="18" r="4" fill="#f85149"/>
    <circle cx="32" cy="18" r="4" fill="#d29922"/>
    <circle cx="46" cy="18" r="4" fill="#3fb950"/>
    <text x="146" y="22" class="mono" font-size="12" fill="#8b949e" text-anchor="end">manifest</text>
    <line x1="0" y1="34" x2="160" y2="34" stroke="#30363d"/>

    <g class="mono" font-size="11">
      <text x="14" y="62"><tspan fill="#79c0ff">id</tspan><tspan fill="#8b949e"> = </tspan><tspan fill="#a5d6ff">"my-app"</tspan></text>
      <text x="14" y="86"><tspan fill="#79c0ff">thinking</tspan><tspan fill="#8b949e"> = </tspan><tspan fill="#a5d6ff">"high"</tspan></text>
      <text x="14" y="110"><tspan fill="#79c0ff">tools</tspan><tspan fill="#8b949e"> = </tspan><tspan fill="#a5d6ff">["read"]</tspan></text>
      <text x="14" y="134" fill="#ffa657">[provider]</text>
      <text x="14" y="158" fill="#ffa657">[model]</text>
      <text x="14" y="182" fill="#ffa657">[[extensions]]</text>
    </g>
  </g>

  <!-- Arrow (centered in the 56px gap between the cards) -->
  <line x1="698" y1="160" x2="728" y2="160" stroke="#8b949e" stroke-width="2.5" marker-end="url(#arrowhead)"/>

  <!-- Right: standalone app card -->
  <g transform="translate(744,58)">
    <rect width="160" height="204" rx="10" fill="#161b22" stroke="#30363d"/>
    <circle cx="18" cy="18" r="4" fill="#f85149"/>
    <circle cx="32" cy="18" r="4" fill="#d29922"/>
    <circle cx="46" cy="18" r="4" fill="#3fb950"/>
    <text x="146" y="22" class="mono" font-size="12" fill="#8b949e" text-anchor="end">app</text>
    <line x1="0" y1="34" x2="160" y2="34" stroke="#30363d"/>

    <rect x="48" y="70" width="64" height="64" rx="14" fill="#0d419d" fill-opacity="0.35" stroke="#58a6ff" stroke-width="2"/>
    <text x="80" y="118" class="mono" font-size="42" font-weight="700" fill="#58a6ff" text-anchor="middle">&#960;</text>
    <text x="80" y="163" class="mono" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="middle">my-app</text>
    <rect x="40" y="176" width="80" height="8" rx="4" fill="#30363d"/>
  </g>
</svg>
